# Default gswitch configuration (created by package)
layout-switch=auto
convert-key=0

# Swap Ctrl and Shift for a custom conversion key.
# true: Shift converts the selection, Ctrl corrects the whole line.
# This setting has no effect when convert-key=0.
swap-conversion-modifiers=false
delay=10
layout-switch-delay=100
# layout1 and layout2 are auto-detected from system settings
# Uncomment and set manually only if auto-detection fails:
# layout1=us
# layout2=ru
