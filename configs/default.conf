# Default gswitch configuration (created by package)
layout-switch=auto
# One evdev scancode only; use 0 for double Shift. Combinations are unsupported.
convert-key=0
delay=10
layout-switch-delay=100
# layout1 and layout2 are auto-detected from system settings
# Uncomment and set manually only if auto-detection fails:
# layout1=us
# layout2=ru
